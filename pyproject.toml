[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "projlearn"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "Pillow>=9.5",
    "scikit-learn>=1.3",
    "POT>=0.9",
    "gdown>=4.7",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]
